[package]
name = "dcc-media-enhance"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Agent-first, bounded orchestration of existing media enhancement backends"

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
sha2 = "=0.10.9"
libc = "=0.2.186"

[profile.dev]
debug = 0
incremental = false

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
