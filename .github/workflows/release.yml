name: release-binaries
# A maintainer must explicitly create/publish the versioned release first.
# This workflow never creates tags, publishes packages, or changes visibility.
on:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  build:
    uses: ./.github/workflows/test.yml
  attach:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dcc-media-enhance-*
          path: release-assets
          merge-multiple: true
      - name: Validate existing release and attach immutable platform archives
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$(find release-assets -name '*.zip' | wc -l)" -eq 4
          for platform in linux-x86_64 windows-x86_64 macos-x86_64 macos-aarch64; do
            test -f "release-assets/dcc-media-enhance-${RELEASE_TAG#v}-$platform.zip"
          done
          (cd release-assets && cat *.sha256 > SHA256SUMS && sha256sum --check SHA256SUMS)
          gh release view "$RELEASE_TAG" >/dev/null
          # No --clobber: reruns cannot silently replace published bytes.
          gh release upload "$RELEASE_TAG" release-assets/*.zip release-assets/SHA256SUMS
