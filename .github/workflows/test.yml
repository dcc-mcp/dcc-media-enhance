name: native-test-and-package
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  native:
    name: native-${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x86_64
            target: x86_64-unknown-linux-gnu
            binary: dcc-media-enhance
          - os: windows-2022
            platform: windows-x86_64
            target: x86_64-pc-windows-msvc
            binary: dcc-media-enhance.exe
          - os: macos-15-intel
            platform: macos-x86_64
            target: x86_64-apple-darwin
            binary: dcc-media-enhance
          - os: macos-15
            platform: macos-aarch64
            target: aarch64-apple-darwin
            binary: dcc-media-enhance
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      CARGO_BUILD_JOBS: 2
      DCC_MEDIA_BUILD_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.85.0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Linux CPU backend
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y ffmpeg
      - name: Install macOS CPU backend
        if: runner.os == 'macOS'
        run: brew list ffmpeg >/dev/null 2>&1 || brew install ffmpeg
      - name: Install Windows CPU backend
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install ffmpeg --no-progress --yes
          if ($LASTEXITCODE -ne 0) { throw 'FFmpeg provisioning failed.' }
      - name: Prepare pinned msvc-kit
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/ci/prepare-msvc-kit.ps1
      - name: Native Windows doctor, tests and release build
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/ci/windows-build.ps1
      - name: Native Unix unit tests and release build
        if: runner.os != 'Windows'
        run: |
          cargo test --locked --release
          cargo build --locked --release
      - name: Install pinned Core SDK for private skill contract verification
        run: |
          python -m pip install --only-binary=:all: dcc-mcp-core==0.20.44
      - name: Portable CLI contract and real CPU smoke
        shell: bash
        run: |
          python tests/test_pe_checks.py
          python tests/test_blender_api_compat.py
          python tests/contract_smoke.py --binary "target/release/${{ matrix.binary }}"
          python tests/smoke.py --binary "target/release/${{ matrix.binary }}"
          python tests/lifecycle_smoke.py --binary "target/release/${{ matrix.binary }}"
          python tests/test_skill_bridge.py --binary "target/release/${{ matrix.binary }}"
      - name: Linux adversarial regressions
        if: runner.os == 'Linux'
        run: python tests/risk_smoke.py --binary target/release/dcc-media-enhance
      - name: Install pinned CLI for isolated Linux gateway acceptance
        if: runner.os == 'Linux'
        run: |
          python -m pip install --only-binary=:all: --no-deps dcc-mcp-cli==0.20.44
      - name: Real Linux gateway discovery, execution and cancellation
        if: runner.os == 'Linux'
        run: python tests/test_gateway_e2e.py --binary target/release/dcc-media-enhance --report target/gateway-e2e-report.json
      - uses: actions/upload-artifact@v4
        if: always() && runner.os == 'Linux'
        with:
          name: gateway-e2e-linux
          path: target/gateway-e2e-report.json
          if-no-files-found: warn
          retention-days: 7
      - name: Package only native-tested executable
        shell: bash
        run: python scripts/ci/package.py --binary "target/release/${{ matrix.binary }}" --platform "${{ matrix.platform }}" --target "${{ matrix.target }}"
      - uses: actions/upload-artifact@v4
        with:
          name: dcc-media-enhance-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always() && runner.os == 'Windows'
        with:
          name: msvc-kit-doctor-windows-x86_64
          path: msvc-kit-doctor.json
          if-no-files-found: warn
          retention-days: 7
