name: test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  linux-cpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install CPU test backend from Ubuntu packages
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ffmpeg
      - name: Unit tests
        run: cargo test --locked
      - name: Build CLI
        run: cargo build --locked
      - name: Installed CPU backend smoke tests
        run: |
          command -v ffmpeg
          command -v ffprobe
          python3 tests/smoke.py --binary "$PWD/target/debug/dcc-media-enhance"
      - name: Cache and cancellation safety regressions
        run: python3 tests/risk_smoke.py --binary "$PWD/target/debug/dcc-media-enhance"
      - name: Prepare tested Linux preview artifact
        run: |
          mkdir -p target/linux-preview
          cp target/debug/dcc-media-enhance LICENSE THIRD_PARTY_NOTICES.md Cargo.lock target/linux-preview/
          rustc --version --verbose > target/linux-preview/build-runtime.txt
          ldd --version | head -n 1 >> target/linux-preview/build-runtime.txt
          sha256sum target/linux-preview/dcc-media-enhance > target/linux-preview/SHA256SUMS
          SYSROOT="$(rustc --print sysroot)"
          for NAME in COPYRIGHT-library.html COPYRIGHT.html LICENSE-APACHE LICENSE-MIT; do
            if test -f "$SYSROOT/share/doc/rust/$NAME"; then
              cp "$SYSROOT/share/doc/rust/$NAME" target/linux-preview/
            fi
          done
          if test -d "$SYSROOT/share/doc/rust/licenses"; then
            cp -R "$SYSROOT/share/doc/rust/licenses" target/linux-preview/rust-licenses
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64-tested-preview
          path: target/linux-preview/
          if-no-files-found: error
          retention-days: 3
