name: test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  linux-cpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install CPU test backend from Ubuntu packages
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ffmpeg
      - name: Unit tests
        run: cargo test --locked
      - name: Build CLI
        run: cargo build --locked
      - name: Installed CPU backend smoke tests
        run: |
          command -v ffmpeg
          command -v ffprobe
          python3 tests/smoke.py --binary "$PWD/target/debug/dcc-media-enhance"
      - name: Cache and cancellation safety regressions
        run: python3 tests/risk_smoke.py --binary "$PWD/target/debug/dcc-media-enhance"
