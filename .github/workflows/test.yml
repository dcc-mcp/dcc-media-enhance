name: test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  linux-cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests
        run: cargo test --locked
        env:
          CARGO_BUILD_JOBS: 2
      - name: Build CLI
        run: cargo build --locked
      - name: Installed CPU backend smoke tests
        run: |
          command -v ffmpeg
          command -v ffprobe
          python3 tests/smoke.py --binary "$PWD/target/debug/dcc-media-enhance"
